services:
  postgres:
    image: postgres:16-alpine
    container_name: mesaposta-postgres
    environment:
      POSTGRES_USER: mesaposta
      POSTGRES_PASSWORD: mesaposta
      POSTGRES_DB: mesaposta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesaposta -d mesaposta"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mesaposta

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: mesaposta-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - mesaposta

  prometheus:
    image: prom/prometheus:latest
    container_name: mesaposta-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - mesaposta
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mesaposta-grafana
    environment:
      # Dev-only convenience: anonymous viewer access, no login screen to
      # click through just to see the p99 dashboard locally. Never set
      # these in a real deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - mesaposta
    depends_on:
      - prometheus

  api:
    build: .
    container_name: mesaposta-api
    ports:
      - "8080:8080"
    environment:
      # Deployment environment (use development to allow migrations)
      APP_ENV: development
      # HTTP server port
      PORT: "8080"
      # PostgreSQL connection string
      DATABASE_URL: postgres://mesaposta:mesaposta@postgres:5432/mesaposta?sslmode=disable
      # JWT secret for token signing (for development only; replace in production)
      JWT_SECRET: replace-with-a-random-secret-of-at-least-32-bytes
      # Enable database migrations on startup (safe for development)
      MIGRATE_ON_BOOT: "true"
      # OTLP HTTP endpoint for telemetry export
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Service name for observability
      OTEL_SERVICE_NAME: mesaposta-api
      # Connection pool tuning
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "0"
      DB_MAX_CONN_LIFETIME: "1h"
      DB_MAX_CONN_IDLE_TIME: "30m"
      DB_CONNECT_TIMEOUT: "5s"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - mesaposta

networks:
  mesaposta:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
